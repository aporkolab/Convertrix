<nav>
  <div class="logo"></div>
  <ul class="menu" [class.responsive]="isMenuOpen()">
    <div class="menu__item toggle" (click)="toggleMenu()" [class.open]="isMenuOpen()">
      <span></span>
    </div>
    <li class="menu__item">
      <a
        class="link link--dark"
        [routerLink]="['/']"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ><i class="fa fa-home"></i> Home</a
      >
    </li>
    <li class="menu__item">
      <a class="link link--dark" [routerLink]="['/game']" routerLinkActive="active"
        ><i class="fa fa-gamepad"></i> Game</a
      >
    </li>
    <li class="menu__item">
      <a
        [routerLink]="['/contact']"
        routerLinkActive="active"
        class="link link--dark"
        ><i class="fa fa-keyboard-o"></i> Contact</a
      >
    </li>
    <li class="menu__item">
      <a
        (click)="setLanguage(Language.ENGLISH)"
        class="link link--dark"
        >EN</a
      >
    </li>
    <li class="menu__item">
      <a
        (click)="setLanguage(Language.HUNGARIAN)"
        class="link link--dark"
        >HU</a
      >
    </li>
  </ul>
</nav>
